[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "promptexplorer"
dynamic = ["version"]
description = "Настольный менеджер промтов для Stable Diffusion и ComfyUI"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["PySide6==6.12.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3", "build==1.6.1", "pyinstaller==6.22.3"]

[project.gui-scripts]
promptexplorer = "promptexplorer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promptexplorer = ["resources/*.ico", "resources/*.png"]

[tool.setuptools.dynamic]
version = {attr = "promptexplorer.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
