name: Проверки и сборка

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Тесты · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python: ['3.11', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Установить системные библиотеки Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - name: Установить окружение
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Проверить стиль и форматирование
        run: |
          ruff check .
          ruff format --check .
      - name: Запустить тесты
        run: python -m pytest -q
      - name: Проверить запуск приложения
        run: python -m promptexplorer --smoke-test
      - name: Собрать пакет Python
        run: python -m build --no-isolation

  build:
    name: Приложение · ${{ matrix.os }}
    needs: tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Установить системные библиотеки Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - name: Установить окружение
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Собрать приложение
        run: python scripts/build.py
      - name: Проверить сборку Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/PromptExplorer/PromptExplorer.exe -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Проверить сборку Linux
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen dist/PromptExplorer/PromptExplorer --smoke-test
      - name: Сохранить приложение
        run: python scripts/package.py
      - name: Загрузить архив и контрольную сумму
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: PromptExplorer-${{ runner.os }}
          path: |
            dist/PromptExplorer-*.zip
            dist/PromptExplorer-*.tar.gz
            dist/PromptExplorer-*.sha256
          if-no-files-found: error
          retention-days: 14
